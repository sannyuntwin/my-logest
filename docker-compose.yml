version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: logistics_db
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics123
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: logistics_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: logistics_web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
